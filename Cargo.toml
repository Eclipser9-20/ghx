[package]
name = "ghx"
version = "0.1.0"
edition = "2021"
description = "A GitHub CLI (gh-compatible surface) with a nicer UX, written in Rust"
license = "MIT"

[[bin]]
name = "ghx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
colored = "2"
open = "5"
# Vendored: builds libgit2 (+ OpenSSL where needed) from source at compile
# time. No system libgit2/OpenSSL dependency on any platform — this is what
# makes git operations "ours" rather than a shell-out to a `git` binary.
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
# OS-native credential storage: Windows Credential Manager, macOS Keychain,
# Linux Secret Service (libsecret) / kwallet. Real encryption-at-rest tied
# to the OS login, not a DIY scheme.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
